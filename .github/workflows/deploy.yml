name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to deploy the current main commit to
        required: true
        type: choice
        options: [staging, production]

permissions:
  contents: read
  actions: read

concurrency:
  group: deploy-${{ inputs.environment || 'staging' }}
  cancel-in-progress: false

jobs:
  gate:
    name: Confirm the commit passed CI
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' &&
       vars.MOASHIR_STAGING_AUTO_DEPLOY == 'true' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      commit: ${{ steps.target.outputs.commit }}
      environment: ${{ steps.target.outputs.environment }}
    steps:
      - name: Resolve the commit and the environment
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          RUN_COMMIT: ${{ github.event.workflow_run.head_sha }}
          DISPATCH_COMMIT: ${{ github.sha }}
          DISPATCH_ENVIRONMENT: ${{ inputs.environment }}
        run: |
          if [ "${EVENT_NAME}" = "workflow_run" ]; then
            commit="${RUN_COMMIT}"
            environment="staging"
          else
            commit="${DISPATCH_COMMIT}"
            environment="${DISPATCH_ENVIRONMENT}"
            passed="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${commit}&status=success&event=push" --jq '.total_count')"
            if [ "${passed:-0}" -lt 1 ]; then
              echo "::error::Commit ${commit} has no successful CI run on main; deploy refused."
              exit 1
            fi
          fi
          echo "commit=${commit}" >> "${GITHUB_OUTPUT}"
          echo "environment=${environment}" >> "${GITHUB_OUTPUT}"

  deploy:
    name: Deploy ${{ needs.gate.outputs.environment }}
    needs: gate
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment:
      name: ${{ needs.gate.outputs.environment }}
      url: ${{ needs.gate.outputs.environment == 'production' && 'https://moashir.ttshub.live' || 'https://staging.moashir.ttshub.live' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.gate.outputs.commit }}
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: muasher/package-lock.json

      - name: Check that the environment's deploy secrets exist
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
        run: |
          missing=""
          [ -n "${DEPLOY_HOST}" ] || missing="${missing} DEPLOY_HOST"
          [ -n "${DEPLOY_SSH_PRIVATE_KEY}" ] || missing="${missing} DEPLOY_SSH_PRIVATE_KEY"
          [ -n "${DEPLOY_SSH_KNOWN_HOSTS}" ] || missing="${missing} DEPLOY_SSH_KNOWN_HOSTS"
          if [ -n "${missing}" ]; then
            echo "::error::Add the environment secrets:${missing} (deploy/RUNBOOK.md, CI-gated deployment)."
            exit 1
          fi

      - name: Write the deploy key and the verified host key
        env:
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
        run: |
          install -d -m 700 "${RUNNER_TEMP}/ssh"
          printf '%s\n' "${DEPLOY_SSH_PRIVATE_KEY}" > "${RUNNER_TEMP}/ssh/deploy_key"
          printf '%s\n' "${DEPLOY_SSH_KNOWN_HOSTS}" > "${RUNNER_TEMP}/ssh/known_hosts"
          chmod 600 "${RUNNER_TEMP}/ssh/deploy_key" "${RUNNER_TEMP}/ssh/known_hosts"

      - name: Build, upload, activate and smoke-check the release
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SSH_PORT: ${{ vars.DEPLOY_SSH_PORT || '22' }}
          DEPLOY_SSH_USER: moashir-deploy
          DEPLOY_SSH_IDENTITY_FILE: ${{ runner.temp }}/ssh/deploy_key
          DEPLOY_SSH_KNOWN_HOSTS_FILE: ${{ runner.temp }}/ssh/known_hosts
          DEPLOY_COMMIT: ${{ needs.gate.outputs.commit }}
          TARGET_ENVIRONMENT: ${{ needs.gate.outputs.environment }}
          VITE_SENTRY_DSN: ${{ vars.VITE_SENTRY_DSN }}
        run: bash deploy/deploy.sh "${TARGET_ENVIRONMENT}" deploy

      - name: Remove the deploy key
        if: always()
        run: rm -rf "${RUNNER_TEMP}/ssh"
