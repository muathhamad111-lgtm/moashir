map $request_uri $moashir_log_path {
    default $uri;
    "~^(/(?:api/v1/)?auth/(?:reset-password|invitations)/)[^/?]*([^?]*)" "$1[redacted]$2";
    "~^([^?]*)" $1;
}

log_format moashir_privacy '$remote_addr - [$time_local] "$request_method $moashir_log_path $server_protocol" $status $body_bytes_sent $request_time "$http_user_agent"';

map $http_accept_language $moashir_request_too_large {
    default '{"data":null,"meta":{},"message":"حجم الطلب كبير جدًا.","code":"request.too_large","errors":{}}';
    "~*^en" '{"data":null,"meta":{},"message":"The request is too large.","code":"request.too_large","errors":{}}';
}
