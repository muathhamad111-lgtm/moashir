add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://cdn.moyasar.com; style-src 'self' https://cdn.moyasar.com; img-src 'self' data: blob: https://cdn.moyasar.com; font-src 'self' data:; connect-src 'self' https://api.moyasar.com; frame-src https://*.moyasar.com; form-action 'self' https://*.moyasar.com; worker-src 'self'; manifest-src 'self'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'; upgrade-insecure-requests" always;
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), usb=(), payment=(self)" always;
add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
add_header X-Permitted-Cross-Domain-Policies "none" always;
