# Installed by provision.sh pdf-renderer as /etc/systemd/system/php8.4-fpm.service.d/moashir-chrome-sandbox.conf.
# Ubuntu's php8.4-fpm.service sets RestrictNamespaces=true, which stops chrome-headless-shell from creating the
# namespaces its sandbox needs ("No usable sandbox"), so every PDF rendered inside a web request fails. This drop-in
# allows only the namespace types the Chrome sandbox uses; all other namespace types stay blocked. Which binary may
# create user namespaces is still limited by the moashir-chrome-headless-shell AppArmor profile.
[Service]
RestrictNamespaces=user pid net
